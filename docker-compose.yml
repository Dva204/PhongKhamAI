version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthcare_postgres
    restart: always
    environment:
      POSTGRES_USER: healthcare_user
      POSTGRES_PASSWORD: healthcare_password
      POSTGRES_DB: healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://healthcare_user:healthcare_password@postgres:5432/healthcare_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
      JWT_SECRET_KEY: healthcare_super_secret_jwt_key_2026
    depends_on:
      - postgres

volumes:
  postgres_data:
